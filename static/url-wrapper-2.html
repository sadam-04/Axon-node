<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <title>Axon</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
      body {
          font-family: Arial, sans-serif;
          background-color: #101010;
          color: #ccc;
      }

      .main-content {
          background-color: #202020;

          position: absolute;

          /* max-width: 76%; */
          width: 20%;
          height: fit-content;

          margin: 25px;
          top: 0;
          bottom: 0;
          left: 0;
          right: 0;

          padding: 1rem 0.8rem 0.8rem;

          margin: auto;

          /* box-shadow: inset 0 0 6px #252525; */
          border-radius: 8px;
      }

      .inner-content {
        border-radius: 8px;
        background-color: #282828;
        padding: 0.8rem 0.6rem 0.6rem;
      }

      .section-title {
          font-size: 1.2rem;
          margin-bottom: 15px;
          color: white;
      }

      #url-text {
          word-break: break-all;
          margin-top: 8px;
          margin-bottom: 15px;
          font-size: 0.8rem;
      }

      #actions {
        font-size: 1rem;
        margin-bottom: 0.5rem;
        color: white;
        margin-left: 2px;
      }

      .button-wrapper {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 100%;
        gap: 6px;
        margin: auto;
      }

      .button {
          padding: 8px 10px;
          font-size: 0.8rem;
          cursor: pointer;
          background-color: #282828;
          color: white;
          border-radius: 8px;
      }

      .button:hover {
          background-color: #343434;
          /* box-shadow: 0 0 6px #303030, 2px 2px 8px -4px #000000, inset 0 0 6px #363636; */
          /* text-shadow: 0 0 8px #000; */
      }

      @media only screen and (max-width: 1274px) {
          .main-content {
              width: 40%;
          }
      }

      @media only screen and (max-width: 599px) {
          .main-content {
              width: 80%;
          }
      }
    </style>

    <script>
      function open_link() {
          window.open('{{url}}', '_blank');
      }

      function copy_link() {
          navigator.clipboard.writeText('{{url}}');
          document.querySelector('#copy-link').innerText = 'Copied!';
      }
    </script>

  </head>
  <body>
    <div class="main-content">
        <span class="section-title"><strong>URL</strong></span>

        <div id="url-text">{{url}}</div>

        <!-- <div class="inner-content"> -->
            <div id="actions"><strong>Actions</strong></div>
            <div class="button-wrapper">
                <div class="button" id="open-link" onClick="open_link()">Open in new tab</div>
                <div class="button" id="copy-link" onClick="copy_link()" onmouseleave="this.innerText='Copy to clipboard'">Copy to clipboard</div>
            </div>
        <!-- </div> -->
    </div>
  </body>
</html>
