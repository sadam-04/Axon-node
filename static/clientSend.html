<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <title>Axon</title>

    <link rel="stylesheet" type="text/css" href="/clientSend.css">

    <meta name="viewport" content="width=device-width, initial-scale=1">


  </head>
  <body>
    <div class="main-content">
      <span class="section-title"><strong>Send</strong></span>
      <div id="subtext">to x.x.x.x</div>

      <div id="upload-form" method="post" enctype="multipart/form-data">
        <!-- <hr style="width:100%" /> -->
        <div class="header-2"><strong>Add items</strong></div>

        <div class="action-bar">
          <form id="text-form" style="margin: 6px 0 0 0; padding: 0;">
            <input type="text" id="text" name="text" class="text-field" style="flex-grow: 1;" placeholder="Add text here"/>
            <input type="submit" class="bttn" style="aspect-ratio: 1/1; flex-grow: 0;" value="~>"/>
          </form>

          <div style="font-size: 0.8rem; width: 100%; display: flex; align-items: center; justify-content: center; height: 20px;"><strong>or</strong></div>

          <label for="file-input" class="bttn">Add Files</label>
          <input id="file-input" name="files" type="file" multiple/>
        </div>

        <div id="queue-and-submit" style="display: none; margin-top: 10px;">
          <div class="header-2"><strong>Queue</strong></div>

          <ul id="send-queue" style="list-style-type: none; margin: 0 0 0 2px; padding: 0;">
          </ul>
  
          <button id="submit-button" type="submit" class="bttn" style="width: 100%; margin-top: 6px;">No items added</button>
        </div>
      </div>
      <div class="spinner-container" style="display: none;">
        <div class="spinner"></div>
      </div>
      <div id="success-message" style="display:none; flex-direction: row; margin: auto; color: #808080; margin-top: 10px;">
        <div id="success-filename" style="white-space: nowrap;"></div>
        <div id="success-text" style="white-space: nowrap;">&nbsp;uploaded successfully!</div>
      </div>
    </div>

    <script>
      const fileQueue = [];
      const textQueue = [];

      function renderQueue() {
        let queue = document.getElementById('send-queue');
        queue.innerHTML = "";
        for (file of fileQueue) {
          const newItem = document.createElement("li");
          newItem.style.fontSize = "0.8rem";
          newItem.textContent = file.name;
          queue.appendChild(newItem);
        }
        for (text of textQueue) {
          const newItem = document.createElement("li");
          newItem.style.fontSize = "0.8rem";
          newItem.textContent = text; // .slice(0, 10);
          queue.appendChild(newItem);
        }

        let totalSize = fileQueue.length + textQueue.length;

        if (totalSize > 0) {
          let submitBttn = document.getElementById("submit-button");
          submitBttn.innerText = "Send " + (totalSize).toString() + " items";
          
          document.getElementById("queue-and-submit").style.display = "block";
        } else {
          document.getElementById("queue-and-submit").style.display = "none";
        }

      }

      const fileInput = document.getElementById('file-input');
      fileInput.addEventListener('change', (event) => {
        if (event.target.files.length === 0) {
          return;
        }
        for (file of event.target.files) {
          //add files to queue
          fileQueue.push(file);

          // re-render
          renderQueue();
        }
      });

      const textInput = document.getElementById('text');
      document.getElementById("text-form").addEventListener("submit", (event) => {
        event.preventDefault();
        textQueue.push(textInput.value);
        textInput.value = "";

        // re-render
        renderQueue();
      });

      document.getElementById("submit-button").addEventListener("click", async (e) => {
        e.preventDefault();

        let textInput = document.getElementById('text');
        let sendQueue = document.getElementById('send-queue');
        let fileInput = document.getElementById('file-input');
        
        const formData = new FormData();
        
        // formData.append("text", textInput.value);
        if (textQueue.length != 0) {
          formData.append("text", JSON.stringify(textQueue));
        }

        for (file of fileQueue) {
          formData.append("files", file);
        }

        document.querySelector(".spinner-container").style.display = "flex";
        const res = await fetch("/intake", {
          method: "POST",
          body: formData
        });
        console.log("response: " + res);
        document.querySelector(".spinner-container").style.display = "none";

        // let successMsg = document.getElementById('success-message');
        // let fileName = document.getElementById('file-name');
        // let successFilename = document.getElementById('success-filename');

        if (res.ok) {
          // successMsg.style.display = "flex";
          // if (fileName.textContent !== "No file chosen") {
          //   if (textInput.value !== "") {
          //     successFilename.textContent = "2 items";
          //   } else {
          //     successFilename.textContent = fileName.textContent;
          //   }
          // } else {
          //   if (textInput.value !== "") {
          //     successFilename.textContent = "Text";
          //   }
          // }
          // fileName.textContent = "No file chosen";
          textInput.value = "";
          sendQueue.innerHTML = "";
          fileInput.value = "";
          fileQueue.length = 0;
          textQueue.length = 0;

          renderQueue();

          // document.getElementById('upload-form').reset();
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("subtext").innerText = "to " + window.location.host;
      })
    </script>
  </body>
</html>
